<div class="fab-cluster">
  <button
    mat-fab
    type="button"
    class="fab-main"
    [attr.aria-label]="isComposerPanelOpen ? 'Close create post modal' : 'Create post'"
    (click)="toggleComposer.emit()"
  >
    <mat-icon>{{ isComposerPanelOpen ? 'close' : 'add' }}</mat-icon>
  </button>
</div>
