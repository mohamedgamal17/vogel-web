@if (isComposerPanelOpen) {
  <section class="composer-panel" aria-label="Create post composer">
    <mat-card class="composer-card">
      <mat-card-header>
        <mat-card-title>Create Post</mat-card-title>
      </mat-card-header>
      <mat-card-content class="space-y-3">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>What do you want to share?</mat-label>
          <textarea matInput rows="3" [value]="draftPostText" (input)="onDraftInput($event)"></textarea>
        </mat-form-field>

        <div class="composer-controls">
          <label for="media-upload-input" class="media-upload-label">
            <mat-icon>add_photo_alternate</mat-icon>
            <span>Add image/video</span>
          </label>
          <input
            id="media-upload-input"
            type="file"
            accept="image/*,video/*"
            multiple
            (change)="onMediaChange($event)"
          />

          <button mat-stroked-button type="button" (click)="clearDraft.emit()">Clear</button>
          <button mat-flat-button type="button" [disabled]="!draftPostText && !composerMediaPreviews.length">
            Post
          </button>
        </div>

        @if (composerMediaPreviews.length) {
          <div class="composer-preview-grid">
            @for (media of composerMediaPreviews; track media.previewUrl; let i = $index) {
              <div class="composer-preview-item">
                @if (media.kind === 'image') {
                  <img [src]="media.previewUrl" [alt]="media.name" />
                } @else {
                  <video [src]="media.previewUrl" controls preload="metadata"></video>
                }

                <div class="composer-preview-meta">
                  <span>{{ media.name }}</span>
                  <button mat-icon-button type="button" aria-label="Remove media" (click)="removeMedia.emit(i)">
                    <mat-icon>close</mat-icon>
                  </button>
                </div>
              </div>
            }
          </div>
        }
      </mat-card-content>
    </mat-card>
  </section>
}
