<section
  class="px-4 py-16 sm:px-6 sm:py-20 lg:px-8"
  aria-labelledby="final-cta-heading"
>
  <div
    class="mx-auto max-w-4xl rounded-3xl bg-[var(--mat-sys-primary)] px-6 py-12 text-center text-[var(--mat-sys-on-primary)] sm:px-10"
  >
    <h2 id="final-cta-heading" class="text-3xl font-bold tracking-tight sm:text-4xl">Ready to join Vogel?</h2>
    <p class="final-cta-supporting-text mx-auto mt-4 max-w-xl text-sm sm:text-base">
      Sign in with Auth0 to get started - your people are already here.
    </p>
    <div class="mt-8 flex flex-col items-stretch justify-center gap-3 sm:flex-row sm:justify-center">
      <button
        mat-flat-button
        type="button"
        class="cta-login-on-primary final-cta-login-button !px-8"
        (click)="onLogin()"
      >
        Log in with Auth0
      </button>
    </div>
  </div>
</section>
