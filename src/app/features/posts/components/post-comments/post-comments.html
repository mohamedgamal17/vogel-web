<section class="comments-block">
  <h4 class="m-0 mb-3 text-sm font-semibold">Comments</h4>

  <div class="comment-composer">
    <mat-form-field class="comment-input" subscriptSizing="dynamic">
      <mat-label>Add a comment</mat-label>
      <textarea
        matInput
        rows="1"
        [(ngModel)]="newCommentContent"
        placeholder="Share your thoughts..."
      ></textarea>
    </mat-form-field>

    <div class="composer-actions">
      <button mat-flat-button type="button" [disabled]="!canSubmitComment" (click)="submitComment()">
        Comment
      </button>
    </div>
  </div>

  @if (comments.length === 0) {
    <p class="m-0 text-sm opacity-70">No comments yet. Be the first to comment.</p>
  } @else {
    <div class="comments-list">
      @for (comment of comments; track comment.id) {
        <app-post-comment-item
          [postId]="postId"
          [comment]="comment"
          (createReply)="onCreateReply($event)"
        />
      }
    </div>
  }
</section>
